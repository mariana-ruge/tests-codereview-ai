[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "payments-svc"
version = "0.1.0"
description = "API de pagos para demos de testing y code review con IA."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "mutmut>=3.2",
]

[tool.setuptools.packages.find]
where = ["src"]

