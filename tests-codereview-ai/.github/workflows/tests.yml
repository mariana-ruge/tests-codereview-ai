name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch: {}

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: Smoke test
        run: python scripts/smoke_test.py

      - name: Run tests
        # test_canary_intentionally_fails esta disenado para fallar siempre
        # (existe para validar que el runner reporta fallos correctamente),
        # asi que se excluye del gate normal de CI. Ver tests/test_amounts.py.
        run: pytest tests/ -k "not test_canary_intentionally_fails" -v
