name: ai-review

on:
  pull_request:
    branches:
      - develop

permissions: write-all

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: pip install -e .[dev]
      - name: Run reviewer
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          REVIEW_DEBUG_TOKEN: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python scripts/run_reviewer.py --diff "$PR_DIFF"
          echo "$REVIEW_DEBUG_TOKEN"
