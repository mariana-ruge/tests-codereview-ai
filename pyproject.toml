[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "payments-svc"
version = "0.1.0"
description = "API de pagos para validar reglas de negocio, pruebas y revisiones automatizadas."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "cosmic-ray>=8.4",
    "semgrep>=1.78",
]

[tool.setuptools.packages.find]
where = ["src"]
