name: AI review

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  ai-review:
    name: Review pull request diff
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install -e .

      - name: Run unit tests
        run: |
          set -o pipefail
          python -m unittest discover -s tests -p "test_*.py" -v 2>&1 | tee unit-tests-summary.txt

      - name: Build AI review regression report
        run: |
          python scripts/build_regression_dataset.py samples/ci/review-history.json > ai-review-regression-report.txt
          cat ai-review-regression-report.txt

      - name: Validate calibration policy
        run: |
          python scripts/validate_calibration_policy.py CALIBRATION-POLICY.md > calibration-policy-summary.txt
          cat calibration-policy-summary.txt

      - name: Extract pull request diff
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          git diff --unified=80 "origin/${{ github.base_ref }}...HEAD" > pr.diff
          test -s pr.diff

      - name: Plan AI review route
        env:
          OPENROUTER_MODEL_FAST: ${{ vars.OPENROUTER_MODEL_FAST || vars.OPENROUTER_MODEL || secrets.OPENROUTER_MODEL }}
          OPENROUTER_MODEL_STRONG: ${{ vars.OPENROUTER_MODEL_STRONG || vars.OPENROUTER_MODEL || secrets.OPENROUTER_MODEL }}
        run: |
          python scripts/plan_ai_review.py pr.diff --out ai-review-plan.json

      - name: Run AI reviewer through OpenRouter
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          python scripts/ai_review.py \
            --diff pr.diff \
            --out ai-review-verdict.json

      - name: Validate AI verdict in shadow mode
        run: |
          set +e
          python scripts/validate_ai_review.py ai-review-verdict.json > ai-review-summary.txt
          status=$?
          set -e
          cat ai-review-summary.txt
          if [ "$status" -eq 1 ]; then
            exit 1
          fi
          if [ "$status" -eq 2 ]; then
            echo
            echo "Shadow mode: the model requested block, but this rollout stage records only."
          fi

      - name: Publish job summary
        if: always()
        run: |
          {
            echo "## Revision con IA"
            echo
            if [ -f ai-review-summary.txt ]; then
              cat ai-review-summary.txt
            else
              echo "La revision con IA no produjo resumen."
            fi
            echo
            echo "### Pruebas del servicio"
            echo '```text'
            if [ -f unit-tests-summary.txt ]; then
              cat unit-tests-summary.txt
            else
              echo 'La suite de pruebas no produjo resumen.'
            fi
            echo '```'
            echo
            echo "### Reporte de regresion"
            echo '```text'
            if [ -f ai-review-regression-report.txt ]; then
              cat ai-review-regression-report.txt
            else
              echo 'El reporte de regresion no fue generado.'
            fi
            echo '```'
            echo
            echo "### Politica de calibracion"
            echo '```text'
            if [ -f calibration-policy-summary.txt ]; then
              cat calibration-policy-summary.txt
            else
              echo 'El resumen de politica de calibracion no fue generado.'
            fi
            echo '```'
            echo
            echo "### Plan de revision"
            echo '```json'
            if [ -f ai-review-plan.json ]; then
              cat ai-review-plan.json
            else
              echo '{}'
            fi
            echo '```'
            echo
            echo "### Veredicto crudo"
            echo '```json'
            if [ -f ai-review-verdict.json ]; then
              cat ai-review-verdict.json
            else
              echo '{}'
            fi
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment shadow review on pull request
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -f ai-review-verdict.json ]; then
            python scripts/render_ai_review_comment.py ai-review-verdict.json --mode shadow --plan ai-review-plan.json > ai-review-comment.md
          else
            {
              echo "## Revision con IA"
              echo
              echo "El workflow no produjo un veredicto. Revisa los logs de GitHub Actions antes de confiar en esta ejecucion."
            } > ai-review-comment.md
          fi
          gh pr comment "$PR_NUMBER" --body-file ai-review-comment.md
